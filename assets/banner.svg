<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <!-- Dynamic Pulse Keyframes -->
    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8, 8;
        animation: flow 20s linear infinite;
      }
      .node-glow {
        animation: glow 3s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.98); opacity: 0.4; }
        100% { transform: scale(1.02); opacity: 0.8; }
      }
      @keyframes flow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }
      @keyframes glow {
        0% { filter: drop-shadow(0 0 4px rgba(59, 130, 246, 0.4)); }
        100% { filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.8)); }
      }
    </style>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="360" fill="url(#bg-gradient)" rx="16" />

  <!-- Background Grid & Floating Dynamic Graphics (Behind Text) -->
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Ambient Dynamic Circles (Background Accent Layer) -->
  <circle cx="150" cy="80" r="180" fill="#3b82f6" opacity="0.08" class="pulse-circle" />
  <circle cx="1050" cy="280" r="220" fill="#8b5cf6" opacity="0.08" class="pulse-circle" />

  <!-- Background Machine Image Pipeline Diagram Graphics -->
  <g stroke="url(#primary-glow)" stroke-width="2" opacity="0.25">
    <path d="M 100 290 L 350 290 L 500 240 L 700 240 L 850 290 L 1100 290" fill="none" class="dash-flow" />
    <path d="M 200 70 L 400 70 L 550 120 L 750 120 L 900 70 L 1050 70" fill="none" class="dash-flow" />
  </g>

  <!-- Central Foreground Content Container -->
  <g text-anchor="middle" transform="translate(600, 0)">
    
    <!-- Top Decorative Badge -->
    <g transform="translate(0, 48)">
      <rect x="-140" y="0" width="280" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.9" />
      <text x="0" y="19" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">IMMUTABLE INFRASTRUCTURE</text>
    </g>

    <!-- Main Title (Guaranteed Foreground Visibility) -->
    <text x="0" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" class="node-glow">
      Awesome Automated Machine Image Building 🖼️ ⚙️
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      Curated Golden Image Pipelines, Multi-Cloud Provisioning &amp; Open-Source Automation Frameworks
    </text>

    <!-- Dynamic Tech Feature Pills (Foreground Layout) -->
    <g transform="translate(0, 215)">
      <!-- Pill 1: AWS / Azure / GCP -->
      <g transform="translate(-330, 0)">
        <rect x="0" y="0" width="150" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
        <text x="75" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">☁️ Multi-Cloud AMIs</text>
      </g>

      <!-- Pill 2: HashiCorp Packer -->
      <g transform="translate(-165, 0)">
        <rect x="0" y="0" width="150" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
        <text x="75" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🏗️ Packer Pipelines</text>
      </g>

      <!-- Pill 3: DevSecOps Hardening -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
        <text x="82.5" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛡️ Hardened Images</text>
      </g>

      <!-- Pill 4: Container & VM Builds -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="150" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
        <text x="75" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🐧 LXC &amp; OCI Builds</text>
      </g>
    </g>

    <!-- Bottom Accent Line -->
    <rect x="-250" y="295" width="500" height="3" rx="1.5" fill="url(#primary-glow)" />

  </g>
</svg>
